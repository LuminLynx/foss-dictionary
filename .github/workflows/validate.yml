name: Validate Terms
on:
  pull_request:
    paths:
      - 'data/terms.yaml'
      - 'content/terms/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npx ts-node scripts/validate_terms.ts
